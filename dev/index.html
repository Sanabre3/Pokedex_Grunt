<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex - Grunt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .pokemon-card {
            display: flex;
            flex-direction: column;
        }

        .pokemon-info {
            display: flex;
            flex: 1;
            flex-direction: column;
            gap: 12px;
        }

        .pokemon-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: auto;
        }

        .pokemon-price {
            color: #0f9d58;
            font-size: 1rem;
            font-weight: 700;
        }

        .buy-btn {
            background: linear-gradient(135deg, #0f9d58 0%, #34a853 100%);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .buy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(15, 157, 88, 0.24);
        }

        .purchase-box {
            display: grid;
            gap: 12px;
            margin: 16px 0;
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(15, 157, 88, 0.08) 0%, rgba(255, 203, 5, 0.16) 100%);
            border: 1px solid rgba(15, 157, 88, 0.16);
        }

        .purchase-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .purchase-summary strong {
            color: #0f9d58;
            font-size: 1.1rem;
        }

        .purchase-label {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #2c3e50;
        }

        .purchase-note {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .purchase-status {
            min-height: 20px;
            font-size: 0.92rem;
            line-height: 1.4;
            color: #5f6368;
        }

        .purchase-status.success {
            color: #0f9d58;
        }

        .purchase-status.error {
            color: #f44336;
        }

        .google-pay-container {
            min-height: 40px;
        }

        body.dark-theme .purchase-box {
            background: linear-gradient(135deg, rgba(52, 168, 83, 0.18) 0%, rgba(255, 203, 5, 0.12) 100%);
            border-color: rgba(255, 255, 255, 0.08);
        }

        body.dark-theme .purchase-label,
        body.dark-theme .purchase-note {
            color: var(--text-color);
        }

        body.dark-theme .purchase-status {
            color: #b0b8c4;
        }

        body.dark-theme .purchase-status.success,
        body.dark-theme .pokemon-price,
        body.dark-theme .purchase-summary strong {
            color: #81c995;
        }

        body.dark-theme .purchase-status.error {
            color: #f28b82;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">
                <span class="pokeball-icon"></span>
                Pokedex - Grunt
            </h1>
            <div class="header-controls">
                <button class="theme-toggle" id="theme-toggle">
                    <span class="theme-text">D A R K </span>
                </button>
                <button class="favorites-toggle" id="favorites-toggle">
                    Favoritos (<span id="favorites-count">0</span>)
                </button>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="container">
            <!--Busca-->
            <section class="search-section">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Buscar por nome ou ID do Pokemon" class="search-input">
                    <button class="search-btn" id="search-btn"></button>
                </div>
                <div class="filters">
                    <select id="type-filter" class="filter-select">
                        <option value="">Todos os tipos</option>
                    </select>
                    <select id="generation-filter" class="filter-select">
                        <option value="">Todas as Geracoes</option>
                        <option value="1">Geracao I (1-151)</option>
                        <option value="2">Geracao II (152-251)</option>
                        <option value="3">Geracao III (252-386)</option>
                    </select>
                </div>
            </section>
            <!--Lista de Pokemons-->
            <section class="pokemon-grid" id="pokemon-grid">
                <div class="loading" id="loading">
                    <div class="pokeball-loading"></div>
                    <p>Carregando...</p>
                </div>
            </section>
            <!--Paginacao-->
            <div class="pagination" id="pagination">
                <button class="btn-pagination" id="prev-btn" disabled>← Anterior</button>
                <span class="page-info" id="page-info">Pagina 1</span>
                <button class="btn-pagination" id="next-btn">Proximo →</button>
            </div>
        </div>
    </main>
    <!--Detalhes-->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="pokemon-modal">
            <button class="modal-close" id="modal-close">Home</button>
            <div class="modal-content" id="modal-content">
                <!--Preenchimento Dinamico-->
            </div>
        </div>
    </div>
    <script src="scripts/api.js"></script>
    <script src="scripts/pokemon.js"></script>
    <script src="scripts/favorites.js"></script>
    <script src="scripts/purchase.js"></script>
    <script src="scripts/main.js"></script>
    <script async src="https://pay.google.com/gp/p/js/pay.js" onload="onGooglePayLoaded()"></script>
</body>
</html>
